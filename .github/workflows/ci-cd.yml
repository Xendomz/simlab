name: Deploy to aaPanel

on:
  push:
    branches:
      - ci-cd-testing   # atau branch lain untuk auto deploy

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Laravel API
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /www/wwwroot/testingci
            git pull origin ci-cd-testing
            cd .\back-simlab\
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan co:ca

